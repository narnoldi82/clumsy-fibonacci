name: Run Fibonacci

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-fibonacci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest tests/

      - name: Run Clumsy Fibonacci
        run: python fibonacci.py
